name: Daily Telegram Market Briefing

on:
  schedule:
    # 05:00 UTC = 08:00 Moscow (MSK) / 10:00 Almaty
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # needed to persist spot-history.json and press-review.json

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Market Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send_telegram_digest.mjs

      - name: Persist daily data (spot history, press review)
        run: |
          git config user.name "agro-bot"
          git config user.email "agro-bot@users.noreply.github.com"
          git add data/spot-history.json data/press-review.json || true
          git diff --cached --quiet || (git commit -m "chore: daily market data [skip ci]" && git push)
