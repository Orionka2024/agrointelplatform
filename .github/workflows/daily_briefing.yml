name: Daily Telegram Market Briefing

on:
  schedule:
    # 05:00 UTC = 08:00 Moscow (MSK) / 10:00 Almaty
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Market Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: ${{ runner.temp }}/agro-digest-output
        run: node scripts/send_telegram_digest.mjs

      - name: Upload daily market digest artifacts (spot history & press review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-digest-output
          path: ${{ runner.temp }}/agro-digest-output/
          if-no-files-found: ignore
          retention-days: 30

